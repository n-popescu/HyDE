[[global.dependency]]
# Core pacman dependencies imported from Scripts/pkg_core.lst
pacman = [
  # System
  "lua", # for lua runtime
  "luarocks", # Core scripts lib
  "libgirepository", # headers and pkg-config data the lgi rock is built against
  "uwsm", # A standalone Wayland session manager
  "pipewire", # audio/video server
  "pipewire-alsa", # pipewire alsa client
  "pipewire-audio", # pipewire audio client
  "pipewire-jack", # pipewire jack client
  "pipewire-pulse", # pipewire pulseaudio client
  "gst-plugin-pipewire", # pipewire gstreamer client
  "wireplumber", # pipewire session manager
  "pavucontrol", # pulseaudio volume control
  "pamixer", # pulseaudio cli mixer
  "networkmanager", # network manager
  "network-manager-applet", # network manager system tray utility
  "bluez", # bluetooth protocol stack
  "bluez-utils", # bluetooth utility cli
  "blueman", # bluetooth manager gui
  "brightnessctl", # screen brightness control
  "playerctl", # media controls
  "udiskie", # manage removable media
  # Display Manager
  "sddm", # display manager for KDE plasma
  "qt5-quickcontrols", # for sddm theme ui elements
  "qt5-quickcontrols2", # for sddm theme ui elements
  "qt5-graphicaleffects", # for sddm theme effects
  # Window Manager
  "awww", # wallpaper
  "grim", # screenshot tool
  "hyprpicker", # color picker
  "slurp", # region select for screenshot/screenshare
  "satty", # Modern Screenshot Annotation
  "cliphist", # clipboard manager
  "wl-clip-persist", # Keep Wayland clipboard even after programs close (avoids crashes)
  # Dependencies
  "hyprpolkitagent", # authentication agent
  "xdg-desktop-portal-hyprland", # xdg desktop portal for hyprland
  "xdg-desktop-portal-gtk", # file picker and dbus  integration
  "xdg-user-dirs", # Manage user directories like ~/Desktop and ~/Music
  "pacman-contrib", # for system update check
  "parallel", # for parallel processing
  "jq", # for json processing
  "imagemagick", # for image processing
  "qt5-imageformats", # for dolphin image thumbnails
  "ffmpegthumbs", # for dolphin video thumbnails
  "kde-cli-tools", # for dolphin file type defaults
  "libnotify", # for notifications
  "noto-fonts-emoji", # emoji font
  # Theming
  "nwg-look", # gtk configuration tool
  "qt5ct", # qt5 configuration tool
  "qt6ct", # qt6 configuration tool
  "kvantum", # svg based qt6 theme engine
  "kvantum-qt5", # svg based qt5 theme engine
  "qt5-wayland", # wayland support in qt5
  "qt6-wayland", # wayland support in qt6
  # Applications
  "firefox", # browser
  "ark", # kde file archiver
  "unzip", # extracting zip files
  # No text editor: HyDE runs none of its own, and the one it configures
  # (Scripts/dots/wallbash-vim.toml) brings its own vim when it is opted into.
  # * "code", # ide text editor
  "nwg-displays", # monitor management utility
  "fzf", # Command-line fuzzy finder
  # HyDE

]
yay = [
  "hyprquery", # A CLI utility for querying configuration values from hypr-related configuration. Using native hyprlang lib.
  "wlogout", # logout menu

]
paru = [
  "hyprquery", # A CLI utility for querying configuration values from hypr-related configuration. Using native hyprlang lib.
  "wlogout", # logout menu

]
# Fedora / Fedora Asahi Remix mapping of the pacman list above. Fedora has no
# AUR, so the Hyprland-ecosystem packages (marked COPR below) come from
# whichever COPR Scripts/enable_repos_fedora.sh enables (solopasha/hyprland
# on x86_64, lionheartp/Hyprland on aarch64 -- solopasha's has no aarch64
# chroot at all; override either with HYDE_FEDORA_HYPRLAND_COPR) instead of
# the yay/paru arrays above. Names were mapped from the Arch side and are
# best-effort — see FEDORA-ASAHI.md's "aarch64 compatibility" section.
dnf = [
  # System
  "lua", # for lua runtime
  "luarocks", # Core scripts lib
  "gobject-introspection-devel", # headers and pkg-config data the lgi rock is built against
  "uwsm", # A standalone Wayland session manager (COPR fallback if not in Fedora's own repos)
  "pipewire", # audio/video server
  "pipewire-alsa", # pipewire alsa client
  "pipewire-jack-audio-connection-kit", # pipewire jack client
  "pipewire-pulseaudio", # pipewire pulseaudio client
  "gstreamer1-plugin-pipewire", # pipewire gstreamer client
  "wireplumber", # pipewire session manager
  "pavucontrol", # pulseaudio volume control
  "pamixer", # pulseaudio cli mixer
  "NetworkManager", # network manager
  "network-manager-applet", # network manager system tray utility
  "bluez", # bluetooth protocol stack and cli (bundles what Arch splits into bluez-utils)
  "blueman", # bluetooth manager gui
  "brightnessctl", # screen brightness control
  "playerctl", # media controls
  "udiskie", # manage removable media
  # Display Manager
  "sddm", # display manager for KDE plasma
  "qt5-qtquickcontrols", # for sddm theme ui elements
  "qt5-qtquickcontrols2", # for sddm theme ui elements
  "qt5-qtgraphicaleffects", # for sddm theme effects
  # Window Manager (from the Hyprland-ecosystem COPR unless noted)
  "awww", # wallpaper -- COPR; if unavailable, `cargo install awww`
  "grim", # screenshot tool
  "hyprpicker", # color picker -- COPR
  "slurp", # region select for screenshot/screenshare
  "satty", # Modern Screenshot Annotation -- COPR
  "cliphist", # clipboard manager -- COPR
  "wl-clip-persist", # Keep Wayland clipboard even after programs close -- COPR
  # Dependencies
  "hyprpolkitagent", # authentication agent -- COPR
  "xdg-desktop-portal-hyprland", # xdg desktop portal for hyprland -- COPR
  "xdg-desktop-portal-gtk", # file picker and dbus integration
  "xdg-user-dirs", # Manage user directories like ~/Desktop and ~/Music
  # no pacman-contrib equivalent needed: dnf checks for updates natively
  "parallel", # for parallel processing
  "jq", # for json processing
  "ImageMagick", # for image processing
  "qt5-qtimageformats", # for dolphin image thumbnails
  "ffmpegthumbs", # for dolphin video thumbnails
  "kde-cli-tools", # for dolphin file type defaults
  "libnotify", # for notifications
  "google-noto-emoji-fonts", # emoji font
  # Theming
  "nwg-look", # gtk configuration tool -- COPR
  "qt5ct", # qt5 configuration tool
  "qt6ct", # qt6 configuration tool
  "kvantum", # svg based qt6 theme engine
  "kvantum-qt5", # svg based qt5 theme engine
  "qt5-qtwayland", # wayland support in qt5
  "qt6-qtwayland", # wayland support in qt6
  # Applications
  "firefox", # browser
  "ark", # kde file archiver
  "unzip", # extracting zip files
  "nwg-displays", # monitor management utility -- COPR
  "fzf", # Command-line fuzzy finder
  "wlogout", # logout menu -- COPR
  "hyprquery", # CLI utility for querying hypr-related configuration -- COPR, verify availability

]
